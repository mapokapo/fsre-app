repos:
- repo: https://github.com/thoughtworks/talisman
  rev: 'v1.37.0'
  hooks:
    # -   id: talisman-push
    - id: talisman-commit
- repo: local
  hooks:
    - id: commit-msg
      name: validate commit message format
      language: pygrep
      entry: '^(?:(?:feat|fix|docs|style|refactor|test|chore)(?:\([a-zA-Z0-9-\/]+\))?(?:,(?:feat|fix|docs|style|refactor|test|chore)(?:\([a-zA-Z0-9-\/]+\))?)*)\: .+$'
      args:
        - --multiline
        - --negate
      stages:
        - commit-msg