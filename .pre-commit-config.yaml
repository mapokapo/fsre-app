repos:
  - repo: local
    hooks:
      - id: lint-staged
        name: lint-staged
        entry: bunx lint-staged
        language: system
        pass_filenames: false
      - id: test
        name: test
        entry: bun run test
        language: system
        pass_filenames: false
      - id: talisman
        name: talisman
        entry:
          bash -c 'if [ -n "${TALISMAN_HOME:-}" ]; then
          ${TALISMAN_HOME}/talisman_hook_script pre-commit; else echo "TALISMAN
          does not exist. Consider installing from
          https://github.com/thoughtworks/talisman . If you already have
          talisman installed, please ensure TALISMAN_HOME variable is set to
          where talisman_hook_script resides, for example,
          TALISMAN_HOME=${HOME}/.talisman/bin"; fi'
        language: system
        pass_filenames: false
        types: [text]
        verbose: true
      - id: commit-msg
        name: validate commit message format
        language: pygrep
        entry:
          '^(?:(?:feat|fix|docs|style|refactor|test|chore|ci|ai)(?:\([a-zA-Z0-9-\/]+\))?(?:,(?:feat|fix|docs|style|refactor|test|chore|ci|ai)(?:\([a-zA-Z0-9-\/]+\))?)*)\:
          .+$'
        args:
          - --multiline
          - --negate
        stages:
          - commit-msg
      - id: post-merge-install
        name: bun install after merge
        entry: bun install
        language: system
        pass_filenames: false
        stages:
          - post-merge
